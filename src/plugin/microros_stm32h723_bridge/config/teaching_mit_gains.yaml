# Hand-guiding: no arm position stiffness in any mode. Gripper uses the
# calibrated gripper profile. safe_stop disables in place; support the arm.
return:
  kp: [0, 0, 0, 0, 0, 0, 0]
  kd: [1, 1, 1, 1, 1, 1, 1]
hold:
  kp: [0, 0, 0, 0, 0, 0, 2]
  kd: [1, 1, 1, 1, 1, 1, 0.5]
track:
  kp: [0, 0, 0, 0, 0, 0, 100]
  kd: [1, 1, 1, 1, 1, 1, 3]
idle:
  kp: [0, 0, 0, 0, 0, 0, 0]
  kd: [1, 1, 1, 1, 1, 1, 1]
# Arm feed-forward must retain gravity_mit_gains limits: unlike position modes,
# Kp=0 cannot supply torque lost to clipping. Gripper keeps its own 2 Nm limit.
effort_limits: [10, 10, 10, 10, 10, 10, 2]
