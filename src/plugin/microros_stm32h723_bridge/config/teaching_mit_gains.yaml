# Hand-guiding: six-arm gravity + damping; gripper has no commanded torque.
# safe_stop disables in place; support the arm and any held object.
return:
  kp: [0, 0, 0, 0, 0, 0, 0]
  kd: [1, 1, 1, 1, 1, 1, 0]
hold:
  kp: [0, 0, 0, 0, 0, 0, 0]
  kd: [1, 1, 1, 1, 1, 1, 0]
track:
  kp: [0, 0, 0, 0, 0, 0, 0]
  kd: [1, 1, 1, 1, 1, 1, 0]
idle:
  kp: [0, 0, 0, 0, 0, 0, 0]
  kd: [1, 1, 1, 1, 1, 1, 0]
# Retain pure-gravity arm limits: zero Kp cannot replace clipped gravity torque.
effort_limits: [10, 10, 10, 10, 10, 10, 0]
