controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint1_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    joint1_teleop_controller:
      type: position_controllers/JointGroupPositionController
    gravity_compensation_controller:
      type: microros_stm32h723_bridge/GravityCompensationController

joint_state_broadcaster:
  ros__parameters:
    joints: [joint1, joint2, joint3, joint4, joint5, joint6]
    interfaces: [position, velocity, effort]

joint1_trajectory_controller:
  ros__parameters:
    joints: [joint1, joint2, joint3, joint4, joint5, joint6]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: true
    allow_nonzero_velocity_at_trajectory_end: false

joint1_teleop_controller:
  ros__parameters:
    joints: [joint1, joint2, joint3, joint4, joint5, joint6]

# Tune these values while the arm is supported and clear of obstacles.
# A scale of 0 disables gravity feed-forward for that joint.
gravity_compensation_controller:
  ros__parameters:
    joints: [joint1, joint2, joint3, joint4, joint5, joint6]
    model_urdf_path: ""
    startup_hold_duration_sec: 5.0
    gravity_scales: [0.1, 0.15, 0.15, 0.65, 1.0, 1.0]
    effort_limits: [5.0, 5.0, 5.0, 3.0, 3.0, 3.0]
